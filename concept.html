    <h1>日常に、夢のような美しさを纏うコスメブランド</h1>
    <p class="concept-text">
        Luneveilは、夢と現実の境界に広がる幻想的な世界を表現したコスメブランドです。<br>
        月や星のきらめきを取り入れた繊細なデザインと、心ときめくカラーで、メイクをする時間を<br>
        特別なひとときへと変えていきます。<br>
        手に取るたび、眺めるたび、使うたびに心が弾む。<br>
